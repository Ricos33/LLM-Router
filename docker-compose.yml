services:
  gateway:
    build:
      context: .
      target: gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    build:
      context: .
      target: dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - gateway
    volumes:
      - ./data:/app/data
    restart: unless-stopped
