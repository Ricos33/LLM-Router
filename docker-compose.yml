services:
  gateway:
    build:
      context: .
      target: gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - gateway
    restart: unless-stopped
